name: Build Courier APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true

jobs:
  verify:
    name: Lint · Typecheck · Test · Contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:contrast
      - run: npm run lint

  build-apk:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Install dependencies
        run: npm ci
      - name: Sync Capacitor (produces dist/ + android config)
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          npm run build
          npx cap sync android
      - name: Configure single arm64-v8a Release APK (Itel RS 4)
        run: |
          node -e "
            const fs = require('fs');
            let build = fs.readFileSync('android/app/build.gradle', 'utf8');
            build = build.replace(
              /buildTypes\s*\{[\s\S]*?release\s*\{/,
              'buildTypes {\n        release {\n            signingConfig signingConfigs.debug\n'
            );
            build = build.replace(
              /    defaultConfig {/,
              '    splits {\n        abi {\n            enable true\n            reset()\n            include \"arm64-v8a\"\n            universalApk false\n        }\n    }\n    defaultConfig {'
            );
            fs.writeFileSync('android/app/build.gradle', build);
          "
      - name: Raise Gradle memory
        run: |
          node -e "
            const fs = require('fs');
            const p = 'android/gradle.properties';
            let c = fs.readFileSync(p, 'utf8');
            c = c.replace(/org.gradle.jvmargs=.*/, 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError');
            fs.writeFileSync(p, c);
          "
      - name: Build Release APK (arm64-v8a)
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rumah-Keripik-Courier-Capacitor-arm64-v8a-Release
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Courier App ${{ github.ref_name }}
          body: |
            ## Rumah Keripik Courier App (Capacitor) — Itel RS 4

            **APK Release arm64-v8a**
            - Framework: Capacitor 7 + Vite + React
            - Android minimum: 6.0 (API 23)
            - Arsitektur: arm64-v8a

            ### Cara Install
            1. Download `app-arm64-v8a-release.apk`
            2. Buka di file manager Itel RS 4
            3. Izinkan instalasi dari sumber tidak dikenal
            4. Tap untuk install
          files: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          fail_on_unmatched_files: false
