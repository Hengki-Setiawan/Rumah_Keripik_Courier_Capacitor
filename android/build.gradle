// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Workaround: capgo-capacitor-updater tidak kompatibel dengan Gradle 8.11.1 + AGP 8.7.2.
// Error "Type T not present" di DefaultReportContainer saat Gradle mencoba membuat
// testDebugUnitTest task. Solusi: disable test task di subproject capgo saat configure phase.
subprojects { subproject ->
    if (subproject.name.contains('capgo')) {
        subproject.configurations.all {
            resolutionStrategy {
                // force konsistensi agar tidak ada versi bentrok
            }
        }
        subproject.afterEvaluate {
            subproject.tasks.configureEach { task ->
                if (task.name.contains('test') || task.name.contains('Test')) {
                    task.enabled = false
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
